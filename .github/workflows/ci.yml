# Checks every pull request and every push to main: the types, the tests and the build of the web app, each as a check
# of its own, so that a pull request shows which of them failed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request makes its older run useless; on main, every commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: [typecheck, test, "web:build"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The tests of the terminals run on gasho-daemon's Rust terminal host too, when it is built.
      - if: matrix.script == 'test'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            apps/daemon/terminal-host/target
          key: terminal-host-${{ runner.os }}-${{ hashFiles('apps/daemon/terminal-host/Cargo.lock') }}
      - if: matrix.script == 'test'
        run: node apps/daemon/scripts/terminal-host.ts
      - run: npm run ${{ matrix.script }}
