<!doctype html>
<html lang="ja" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-title" content="Gasho" />
    <!-- In the Home Screen app, the page is drawn up under the status bar (the clock and the battery), which is
         transparent with white text: its color is the page's own, so it follows the theme. What touches the top edge
         keeps its content below it by --safe-top (index.css). Safari's tabs ignore this. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Gasho</title>
    <!-- The logo, 🙏, drawn by the device's own emoji font. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='.9em' font-size='90' text-anchor='middle'%3E%F0%9F%99%8F%3C/text%3E%3C/svg%3E" />
    <!-- For the Home Screen: the manifest makes Gasho open as an app, and iOS takes the icon from apple-touch-icon.
         The icons are Noto Emoji's 🙏 (SIL OFL 1.1, /licenses/noto-emoji-OFL.txt). The manifest's icons have a transparent
         background, which Android shows on a white circle; apple-touch-icon is on the background color, since iOS fills
         transparent pixels with black. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The theme in use (src/plugins/theme.ts), set before the page is drawn: a reload shows its colors at once. -->
    <script>
      try {
        const vars = JSON.parse(localStorage.getItem("gasho.theme") || "{}");
        for (const [name, value] of Object.entries(vars)) {
          if (name.startsWith("--") && typeof value === "string") document.documentElement.style.setProperty(name, value);
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
